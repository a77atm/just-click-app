# codemagic.yaml — لازم يفضل في جذر الريبو
workflows:
  android-debug:
    name: Android Debug
    max_build_duration: 30
    working_directory: shoes-app
    environment:
      flutter: stable
      vars:
        FIREBASE_PROJECT_ID: "shoesapp-e64be"
      groups:
        - firebase
    scripts:
      - name: Firestore rules + indexes
        script: |
          chmod +x scripts/deploy_firestore_indexes.sh
          ./scripts/deploy_firestore_indexes.sh
      - name: Verify google-services.json
        script: |
          test -f android/app/google-services.json \
            || { echo "!! android/app/google-services.json مفقود"; exit 1; }
      - name: Get packages
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - shoes-app/build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - a7md7atm0@gmail.com

  android-release:
    name: Android Release
    max_build_duration: 30
    working_directory: shoes-app
    environment:
      flutter: stable
      vars:
        FIREBASE_PROJECT_ID: "shoesapp-e64be"
      groups:
        - firebase
    scripts:
      - name: Firestore rules + indexes
        script: |
          chmod +x scripts/deploy_firestore_indexes.sh
          ./scripts/deploy_firestore_indexes.sh
      - name: Verify google-services.json
        script: |
          test -f android/app/google-services.json \
            || { echo "!! android/app/google-services.json مفقود"; exit 1; }
      - name: Get packages
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - shoes-app/build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - a7md7atm0@gmail.com
